# Migração + carga de dados no banco de produção, disparada manualmente
# (aba Actions → "Carga inicial do banco" → Run workflow).
# Requer o secret DATABASE_URL (Settings → Secrets and variables → Actions).
name: Carga inicial do banco

on:
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos dos arquivos da Câmara (separados por espaço)"
        default: "2026 2025 2024 2023 2022 2021 2020 2019"
        required: true
      so_normas:
        description: "Só projetos que podem virar norma (~214 MB em vez de ~1,2 GB)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ingestao-banco
  cancel-in-progress: false

jobs:
  carga:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Verificar secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL não configurado em Settings → Secrets and variables → Actions."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrações e catálogo de fontes
        run: npm run db:migrate
      - name: Deputados (legislaturas 56 e 57)
        run: npm run ingest -- deputados
      - name: Proposições (arquivos anuais da Câmara)
        env:
          ANOS: ${{ inputs.anos }}
          FLAG: ${{ inputs.so_normas && '--so-normas' || '' }}
        run: npm run ingest -- proposicoes-anuais $ANOS $FLAG
      - name: Notícias (Agência Brasil)
        run: npm run ingest -- noticias
      - name: Gastos da cota parlamentar (2023 em diante)
        run: npm run ingest -- gastos 2026 2025 2024 2023
      - name: Patrimônio declarado ao TSE (eleição de 2022)
        run: npm run ingest -- patrimonio 2022
