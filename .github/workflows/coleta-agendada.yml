# Coletas periódicas no banco de produção. Requer o secret DATABASE_URL.
# Para carregar também requerimentos e emendas, crie a variável de repositório CARGA_COMPLETA=true.
# Observação: o GitHub desativa agendamentos de repositórios públicos sem atividade por 60 dias,
# e horários podem atrasar alguns minutos em momentos de fila.
name: Coleta agendada

on:
  schedule:
    - cron: "*/30 * * * *"   # notícias
    - cron: "17 6 * * *"     # diária: deputados, seguidos e proposições do ano (06:17 UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingestao-banco
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Verificar secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL não configurado."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Notícias
        run: npm run ingest -- noticias
      - name: Coleta diária
        if: github.event.schedule == '17 6 * * *' || github.event_name == 'workflow_dispatch'
        env:
          FLAG: ${{ vars.CARGA_COMPLETA == 'true' && '' || '--so-normas' }}
        run: |
          npm run ingest -- deputados
          npm run ingest -- seguidos
          npm run ingest -- proposicoes-anuais $(date -u +%Y) $FLAG
          npm run ingest -- gastos $(date -u +%Y)
